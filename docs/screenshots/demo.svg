<text x="490" y="23" fill="#8b949e" text-anchor="middle">mcp-leclerc-drive</text>
<text class="l0" x="24" y="72" fill="#e6edf3" xml:space="preserve">Vous    J&#x27;ai besoin de beurre doux et d&#x27;un pack d&#x27;eau gazeuse.</text>
<text class="l1" x="24" y="94" fill="#79c0ff" xml:space="preserve">Claude  ▸ search_product « beurre doux »</text>
<text class="l2" x="24" y="116" fill="#9da7b3" xml:space="preserve">        Beurre Extra fin Les Croisés Doux - 82 % MG - 125g — 1,49 € [11,92 € / kg] · 0,125 kg · 4/5 (15 avis) id=29856</text>
<text class="l3" x="24" y="138" fill="#9da7b3" xml:space="preserve">        Beurre Extra fin Les Croisés Doux - 82% MG - 250g — 2,35 € [9,40 € / kg] · 0,25 kg · 4/5 (87 avis) id=2111</text>
<text class="l4" x="24" y="160" fill="#9da7b3" xml:space="preserve">        Beurre Tendre Les Croisés Doux - 82% MG - 250g — 2,51 € [10,04 € / kg] · 0,25 kg · 3,5/5 (62 avis) id=983</text>
<text class="l5" x="24" y="182" fill="#79c0ff" xml:space="preserve">        ▸ add_to_cart 28099 ×2</text>
<text class="l6" x="24" y="204" fill="#7ee787" xml:space="preserve">        Ajouté — Eau minérale gazeuse St Diery Naturelle - 6x1,25L (id=28099) : 2 au panier, 4,32 €.</text>
<text class="l7" x="24" y="226" fill="#e6edf3" xml:space="preserve">Vous    Et les promos sur le café moulu, au kilo ?</text>
<text class="l8" x="24" y="248" fill="#79c0ff" xml:space="preserve">Claude  ▸ browse_offers « café moulu » · prix_unite</text>
<text class="l9" x="24" y="270" fill="#9da7b3" xml:space="preserve">        Café moulu Eco+ Robusta - 4x250g — 8,85 € [8,85 € / kg] · 1 kg · Cafes · 3/5 (8 avis) id=19392</text>
<text class="l10" x="24" y="292" fill="#9da7b3" xml:space="preserve">        Café moulu Eco+ Décaféiné - 250g — 2,63 € [10,52 € / kg] · 0,25 kg · Cafes · 4,5/5 (5 avis) id=19393</text>
<text class="l11" x="24" y="314" fill="#9da7b3" xml:space="preserve">        Café moulu Eco+ Pur arabica - 500g — 6,18 € [12,36 € / kg] · 0,5 kg · Cafes · 3/5 (8 avis) id=73735</text>
<text class="l12" x="24" y="336" fill="#d2a8ff" xml:space="preserve">        Rien n&#x27;est commandé : vous vérifiez le panier et payez vous-même sur le site.</text>
