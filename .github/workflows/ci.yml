name: CI

# Every push and pull request: typecheck, build and unit tests on Linux, macOS and Windows, the
# network allowlist check on src/ and dist/, the contents of the release tarball, npm audit on the
# runtime dependencies, a secret scan of the whole history and actionlint on the workflows.
# CodeQL runs from codeql.yml. Tags are not pushes here: release.yml calls this workflow on the
# tagged commit.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

# A new push supersedes the running checks of the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every action is pinned to the commit of a release at least two weeks old (resolved from its
# tag on 2026-11-01); the comment names the release and the date it was published. Dependabot
# updates the version but not the date; its 14-day cooldown keeps the age rule.
jobs:
  # Docs-only pull requests skip the heavy jobs: they report "skipped", and the "CI result" job
  # below (the one check to require) passes. A push (any branch, or a tag through release.yml)
  # always runs everything. Only the runner's own variables are read: no event payload.
  changes:
    name: Changed files
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (2026-07-20)
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: filter
        run: |
          base=""
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && [ -n "${GITHUB_BASE_REF:-}" ]; then
            base="$(git merge-base "origin/$GITHUB_BASE_REF" HEAD || true)"
          fi
          if [ -z "$base" ]; then
            echo "code=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          # Anything outside these paths is code: Markdown, docs/, LICENSE and issue templates are
          # not. README.md is packed in the tarball, but a Markdown change cannot break the build.
          code="$(git diff --name-only "$base" HEAD | grep -vE '\.md$|^docs/|^LICENSE$|^\.github/ISSUE_TEMPLATE/' || true)"
          if [ -n "$code" ]; then echo "code=true"; else echo "code=false"; fi >>"$GITHUB_OUTPUT"

  lint:
    name: Workflows (actionlint, shellcheck)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      # rhysd/actionlint release v1.7.12 (2026-03-30), linux_amd64 archive. The checksum is the
      # one in the release's checksums.txt; the download is verified against it before use.
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (2026-07-20)
        with:
          persist-credentials: false
      - name: Install actionlint (checksum verified)
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          cd "$RUNNER_TEMP"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" actionlint
          rm "$archive"
      # actionlint runs shellcheck (preinstalled on the runner) on every run: script.
      - run: |
          shellcheck --version
          "$RUNNER_TEMP/actionlint" -color

  secrets:
    name: Secrets (gitleaks, whole history)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # gitleaks release v8.30.1 (2026-03-21), linux_x64 archive. The checksum is the one in the
      # release's checksums.txt; the download is verified against it before use.
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (2026-07-20)
        with:
          persist-credentials: false
          # The whole history, every branch: a secret removed in a later commit is still a leak.
          fetch-depth: 0
      - name: Install gitleaks (checksum verified)
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          cd "$RUNNER_TEMP"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" gitleaks
          rm "$archive"
      # The default rules (.gitleaks.toml allow-lists nothing). Findings are printed redacted.
      - run: |
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --verbose --exit-code 1 --config .gitleaks.toml .

  # The project claims Linux, macOS and Windows: Node 22 (the minimum in package.json) and 24 on
  # Linux, Node 24 on the other two. The unit tests need no network and no Chrome.
  build:
    name: Build and test (${{ matrix.os }}, Node ${{ matrix.node }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            node: "22"
          - os: ubuntu-24.04
            node: "24"
          - os: macos-15
            node: "24"
          - os: windows-2025
            node: "24"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (2026-07-20)
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 (2026-10-08)
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # No dependency runs an install script; none is allowed to.
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      # The same allowlist the code enforces at runtime, checked on the sources and on the build
      # output (scripts/check-hosts.mjs). Plain text: once on Linux is enough.
      - if: runner.os == 'Linux'
        run: npm run check:hosts
      # The check itself must still catch a stray host: a planted URL has to fail it.
      - name: check-hosts catches a host outside the allowlist
        if: runner.os == 'Linux'
        run: |
          probe="$RUNNER_TEMP/check-hosts-probe"
          mkdir -p "$probe"
          printf 'const ok = "https://www.leclercdrive.fr/";\nconst bad = "https://example.com/x";\n' >"$probe/probe.ts"
          if node scripts/check-hosts.mjs "$probe" >"$RUNNER_TEMP/probe.log" 2>&1; then
            cat "$RUNNER_TEMP/probe.log"
            echo "::error::check-hosts accepted https://example.com"
            exit 1
          fi
          cat "$RUNNER_TEMP/probe.log"
          grep -q 'probe.ts:2: example.com' "$RUNNER_TEMP/probe.log"

  # What `npm pack` would put in the release tarball: dist/ (each file with its src/ file),
  # package.json, README.md, LICENSE and nothing else (scripts/check-pack.mjs).
  package:
    name: Package (npm pack contents)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (2026-07-20)
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 (2026-10-08)
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: node scripts/check-pack.mjs

  # Known vulnerabilities in what users install (the runtime dependencies), high and critical
  # ones. The dev dependencies (typescript, @types/node) never reach a user. The lock file is
  # enough: nothing is installed.
  audit:
    name: Audit (npm audit, runtime dependencies)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (2026-07-20)
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 (2026-10-08)
        with:
          node-version: "24"
      - run: npm audit --omit=dev --audit-level=high

  # The one check to require: green when every job passed or was skipped as docs-only.
  result:
    name: CI result
    if: always()
    needs: [changes, lint, secrets, build, package, audit]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "jobs: $RESULTS"
          for r in $RESULTS; do
            case "$r" in success | skipped) ;; *) exit 1 ;; esac
          done
